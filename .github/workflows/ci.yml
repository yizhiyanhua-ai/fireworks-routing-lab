name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run offline unit tests
        run: pytest tests/test_offline.py -v

      # Live suites (tests/live_routing_matrix.py, tests/live_concurrent.py)
      # hit the real TypeSafe API and are intentionally not run in CI.
      # Run them locally with TYPESAFE_API_KEY set before releases.
